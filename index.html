<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" id="tc" content="#040817" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Pick the theme and accent before first paint (no flash). Mirrors theme.js.
      (function () {
        try {
          var d = document.documentElement;
          var m = localStorage.getItem('gully-theme');
          if (m !== 'light' && m !== 'dark') m = 'system';
          var light = m === 'light' || (m === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
          d.dataset.theme = light ? 'light' : 'dark';
          d.dataset.mode = m;
          document.getElementById('tc').setAttribute('content', light ? '#e9edf5' : '#040817');
          var a = JSON.parse(localStorage.getItem('gully-accent') || 'null');
          if (a && a.c) {
            d.style.setProperty('--accent', a.c);
            d.style.setProperty('--accent-ink', a.i);
            d.style.setProperty('--accent-text', a.t[light ? 'light' : 'dark']);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #040817; }
      html[data-theme='light'] { background: #e9edf5; }
    </style>
    <meta name="description" content="Ball-by-ball scoring for local cricket. Works offline." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GullyScore" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>GullyScore</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
